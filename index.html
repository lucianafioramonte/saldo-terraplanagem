<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparativo de Terraplanagem — Tripoloni Construtora</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --navy-deep:#0b1740;
    --navy:#16247a;
    --navy-mid:#1e2a5e;
    --blue-card:#1c3fa8;
    --blue-text:#1c3fa8;
    --green:#1c9d63;
    --amber:#d98e04;
    --gold:#f2c14e;
    --red:#d43f3f;
    --bg:#eef1f7;
    --row-alt:#f7f9fc;
    --section-bg:#e4eaf7;
    --ink:#1a1f36;
    --muted:#6b7383;
    --line:#e2e6ef;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  #captureArea{ background:var(--bg); }

  /* larguras de coluna (padrão em tela) */
  .col-desc-resumo{ width:32%; }
  .col-num-resumo{ width:22.67%; }
  .col-desc-detail{ width:24%; }
  .col-num-detail{ width:12.67%; }

  /* durante a geração do PNG, a coluna Descrição do Resumo fica mais estreita
     (o Detalhado tem 860px de largura no PNG, então usa a mesma proporção da tela) */
  #captureArea.png-export .col-desc-resumo{ width:26%; }
  #captureArea.png-export .col-num-resumo{ width:24.67%; }

  /* largura do dashboard: largo na tela, estreito só ao gerar o PNG */
  #captureArea > .header,
  #captureArea > .controls{
    max-width:980px;
    margin-left:auto;
    margin-right:auto;
  }
  /* o container do resumo também precisa ter a largura limitada,
     senão a captura do PNG inclui o fundo das laterais como borda */
  #resumoArea{
    max-width:980px;
    margin-left:auto;
    margin-right:auto;
  }
  #captureArea.png-export #resumoArea{
    max-width:650px;
  }
  /* o comparativo detalhado tem mais colunas/informação, então usa uma largura maior no PNG */
  #detalhadoArea{
    max-width:980px;
    margin-left:auto;
    margin-right:auto;
  }
  #captureArea.png-export #detalhadoArea{
    max-width:860px;
  }

  /* ---------- header ---------- */
  .header{
    background:linear-gradient(135deg,var(--navy-deep),var(--navy));
    color:#fff;
    padding:28px 36px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
  }
  .header-text h1{ margin:0 0 8px; font-size:34px; letter-spacing:.5px; font-weight:800; }
  .header-text p{ margin:0; opacity:.85; font-size:16px; }
  .header-logo{ height:56px; width:auto; flex-shrink:0; }

  /* ---------- controls ---------- */
  .controls{ padding:18px 36px; background:#fff; border-bottom:1px solid var(--line); }
  .controls-row{ display:flex; gap:16px; flex-wrap:wrap; align-items:flex-end; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:12.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  select, button{ font-family:inherit; font-size:15px; }
  select{ padding:9px 11px; border-radius:8px; border:1px solid #d4d9e6; min-width:170px; background:#fafbfd; }
  .pick-btn{ padding:9px 14px; border-radius:8px; border:none; background:var(--navy); color:#fff; cursor:pointer; font-weight:700; font-size:13px; white-space:nowrap; }
  .pick-btn:hover{ background:var(--navy-deep); }
  .status{ font-size:14px; color:var(--muted); margin-top:10px; }
  .status.err{ color:var(--red); font-weight:700; }

  /* ---------- section title bar (used above each table) ---------- */
  .panel-title{
    display:flex; align-items:center; justify-content:space-between; gap:24px;
    background:linear-gradient(135deg,var(--navy-deep),var(--navy));
    color:#fff; padding:18px 22px 14px; margin:26px 36px 0;
  }
  .panel-title h2{ margin:0 0 4px; font-size:24px; letter-spacing:.4px; font-weight:800; }
  .panel-title p{ margin:0; font-size:14.5px; opacity:.85; }
  .panel-title img{ height:44px; width:auto; flex-shrink:0; }

  /* ---------- model-style table (matches jpg) ---------- */
  .table-wrap{
    margin:0 36px 6px;
    background:#fff;
    border-radius:0 0 10px 10px;
    overflow:hidden;
    box-shadow:0 1px 3px rgba(20,30,60,.08);
    border:1px solid var(--line);
    border-top:none;
  }
  table{ width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed; }
  thead th{
    background:#f4f6fb; color:var(--muted); text-align:left; padding:9px 14px;
    font-size:10.5px; letter-spacing:.4px; text-transform:uppercase; font-weight:700;
    border-bottom:2px solid var(--line);
    border-right:1px solid var(--line);
  }
  thead th:last-child{ border-right:none; }
  thead th.num{ text-align:right; white-space:normal; word-break:break-word; line-height:1.3; }
  tbody td{ padding:8px 14px; border-bottom:1px solid #f0f2f7; border-right:1px solid #eef0f6; }
  tbody td:last-child{ border-right:none; }
  tbody td.num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }

  tr.section-row td{
    background:var(--section-bg);
    font-weight:800; font-size:13.5px; color:var(--navy-mid);
    border-left:5px solid var(--navy); border-bottom:1px solid #d8e0f2;
    border-right:1px solid #d0d9ee;
  }
  tr.section-row td:last-child{ border-right:none; }
  tr.section-row td:first-child{ padding-left:10px; }
  tr.section-row .sec-sub{ font-weight:500; font-size:11px; color:var(--muted); margin-left:6px; text-transform:none; letter-spacing:0; }

  tr.child-row td{ color:var(--ink); }
  tr.child-row td:first-child{ padding-left:26px; color:#3b4256; }
  tr.child-row .child-sub{ font-size:10.5px; color:var(--muted); margin-left:5px; }
  tr.child-row:nth-child(even){ background:var(--row-alt); }

  tr.total-row td{
    background:var(--navy-deep); color:#fff; font-weight:800; font-size:15px; padding:12px 12px;
    border-right:1px solid rgba(255,255,255,.18);
  }
  tr.total-row td:last-child{ border-right:none; }
  tr.total-row td:first-child{ font-size:16px; letter-spacing:.3px; }

  /* ---------- detailed comparativo table ---------- */
  .table-wrap.detail table{ font-size:11.5px; }
  .table-wrap.detail thead th{ padding:7px 9px; font-size:9px; }
  .table-wrap.detail tbody td{ padding:6px 9px; }
  .table-wrap.detail thead th.num{ white-space:normal; word-break:break-word; line-height:1.25; }
  .table-wrap.detail tbody td.num{ white-space:nowrap; }

  /* versão compacta usada apenas ao gerar o PNG (site continua largo/confortável) */
  #captureArea.png-export .header{ padding:20px 22px 18px; }
  #captureArea.png-export .controls{ padding:14px 22px; }
  #captureArea.png-export .panel-title{ padding:14px 14px 10px; margin:20px 22px 0; }
  #captureArea.png-export table{ font-size:12px; }
  #captureArea.png-export thead th{ padding:7px 9px; }
  #captureArea.png-export tbody td{ padding:6px 9px; }
  #captureArea.png-export .legend{ gap:14px; padding:10px 22px 18px; font-size:11px; }
  #captureArea.png-export .table-wrap{ margin:0 22px 6px; }
  #captureArea.png-export .table-wrap.detail table{ font-size:10px; }
  #captureArea.png-export .table-wrap.detail thead th{ padding:5px 6px; font-size:8px; }
  #captureArea.png-export .table-wrap.detail tbody td{ padding:4px 6px; }

  .arrow-up{ color:var(--green); font-weight:700; }
  .arrow-down{ color:var(--red); font-weight:700; }
  .arrow-flat{ color:#9aa0ad; font-weight:700; }

  .legend{ display:flex; gap:22px; padding:14px 36px 26px; font-size:12.5px; color:var(--muted); flex-wrap:wrap; justify-content:space-between; align-items:center; }

  @media (max-width:900px){
    table{ font-size:12px; }
    .header{ flex-direction:column; align-items:flex-start; }
  }
</style>
</head>
<body>

<div id="captureArea">
<div class="header">
  <div class="header-text">
    <h1>COMPARATIVO DE TERRAPLANAGEM</h1>
    <p id="subtitle">Carregando histórico...</p>
  </div>
  <img class="header-logo" id="headerLogo" src="" alt="Tripoloni Construtora">
</div>

<div class="controls" id="controlsPanel">
  <div class="controls-row">
    <div class="field">
      <label for="atualSelect">Medição atual</label>
      <select id="atualSelect"></select>
    </div>
    <div class="field">
      <label for="anteriorSelect">Medição anterior (comparação)</label>
      <select id="anteriorSelect"></select>
    </div>
    <button class="pick-btn" id="btnDownloadPng" style="background:var(--blue-card);">Baixar PNG Detalhado</button>
    <button class="pick-btn" id="btnDownloadResumoPng" style="background:#2f6f4f;">Baixar PNG do Resumo</button>
  </div>
  <div class="status" id="status">Carregando histórico...</div>
</div>

<div id="dashboard"></div>
</div>

function fmt(n){
  if(n === null || n === undefined || isNaN(n)) return '—';
  return Math.round(n).toLocaleString('pt-BR');
}
function fmt1(n){
  if(n === null || n === undefined || isNaN(n)) return '—';
  return n.toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1});
}
function fmtDateLabel(dateStr){
  const [y,m,d] = dateStr.split('-');
  return `${d}/${m}/${y}`;
}

// ---------- carregamento do histórico (embutido diretamente no arquivo) ----------
function loadHistory(){
  const statusEl = document.getElementById('status');

  const weeks = Object.keys(EMBEDDED_HISTORY)
    .sort()
    .map(date => ({
      date,
      label: `Medição ${fmtDateLabel(date)}`,
      data: new Map(Object.entries(EMBEDDED_HISTORY[date]))
    }));
  loadedWeeks = weeks;

  if(weeks.length > 0){
    populateWeekSelectors(weeks);
    statusEl.textContent = `${weeks.length} medição(ões) no histórico.`;
    document.getElementById('subtitle').textContent = 'Saldo remanescente × projeto · volumes em m³';
    render();
  }else{
    statusEl.textContent = 'Nenhuma medição disponível.';
    document.getElementById('subtitle').textContent = 'Sem dados';
  }
}

function populateWeekSelectors(weeks){
  const atualSel = document.getElementById('atualSelect');
  const anteriorSel = document.getElementById('anteriorSelect');
  atualSel.innerHTML = '';
  anteriorSel.innerHTML = '';
  weeks.forEach((w, idx) => {
    const o1 = document.createElement('option'); o1.value = idx; o1.textContent = w.label;
    const o2 = document.createElement('option'); o2.value = idx; o2.textContent = w.label;
    atualSel.appendChild(o1);
    anteriorSel.appendChild(o2);
  });
  atualSel.selectedIndex = weeks.length - 1;
  anteriorSel.selectedIndex = Math.max(0, weeks.length - 2);
  atualSel.addEventListener('change', render);
  anteriorSel.addEventListener('change', render);
}

// ---------- agregação por seção ----------
function sumWeek(dataMap, keys){
  let previsto = 0, executado = 0, saldo = 0;
  for(const k of keys){
    const v = dataMap.get(k);
    if(v){ previsto += v.previsto; executado += v.executado; saldo += v.saldo; }
  }
  return { previsto, executado, saldo };
}
function sectionTotal(dataMap, section){
  return sumWeek(dataMap, section.items.map(i => i.key));
}
function grandTotal(dataMap){
  return sumWeek(dataMap, ALL_KEYS);
}

// ---------- render: tabela estilo "modelo" (RESUMO) ----------
function renderResumoRow(labelHtml, subHtml, v, {isSection=false, isTotal=false} = {}){
  const saldoT = v.saldo * 2;
  if(isTotal){
    return `
      <tr class="total-row">
        <td>${labelHtml}</td>
        <td class="num">${fmt(v.previsto)}</td>
        <td class="num">${fmt(v.saldo)}</td>
        <td class="num">${fmt(saldoT)}</td>
      </tr>`;
  }
  const rowClass = isSection ? 'section-row' : 'child-row';
  return `
    <tr class="${rowClass}">
      <td>${labelHtml}${subHtml ? `<span class="${isSection?'sec-sub':'child-sub'}">${subHtml}</span>` : ''}</td>
      <td class="num">${fmt(v.previsto)}</td>
      <td class="num">${fmt(v.saldo)}</td>
      <td class="num">${fmt(saldoT)}</td>
    </tr>`;
}
function buildResumoTable(dataMap){
  let rows = '';
  for(const section of SECTIONS){
    const secTotal = sectionTotal(dataMap, section);
    rows += renderResumoRow(section.name, section.sub, secTotal, {isSection:true});
    for(const item of section.items){
      const v = dataMap.get(item.key) || {previsto:0, executado:0, saldo:0};
      rows += renderResumoRow(item.label, item.sub, v, {isSection:false});
    }
  }
  const total = grandTotal(dataMap);
  rows += renderResumoRow('TOTAL GERAL', null, total, {isTotal:true});
  return rows;
}

// ---------- render: tabela detalhada de comparativo (semana anterior x atual) ----------
function arrowFor(delta){
  if(delta > 0.01) return `<span class="arrow-up">▲</span>`;
  if(delta < -0.01) return `<span class="arrow-down">▼</span>`;
  return `<span class="arrow-flat">–</span>`;
}
function buildDetailTable(dataAtual, dataAnterior){
  let rows = '';
  for(const section of SECTIONS){
    const secAtual = sectionTotal(dataAtual, section);
    const secAnterior = sectionTotal(dataAnterior, section);
    const avanco = secAtual.executado - secAnterior.executado;
    rows += detailRow(section.name, section.sub, secAtual, secAnterior, avanco, true);
    for(const item of section.items){
      const vA = dataAtual.get(item.key) || {previsto:0, executado:0, saldo:0};
      const vP = dataAnterior.get(item.key) || {previsto:0, executado:0, saldo:0};
      const av = vA.executado - vP.executado;
      rows += detailRow(item.label, item.sub, vA, vP, av, false);
    }
  }
  const totalAtual = grandTotal(dataAtual);
  const totalAnterior = grandTotal(dataAnterior);
  const totalAvanco = totalAtual.executado - totalAnterior.executado;
  rows += detailRow('TOTAL GERAL', null, totalAtual, totalAnterior, totalAvanco, false, true);
  return rows;
}
function detailRow(label, sub, vA, vP, avanco, isSection, isTotal=false){
  const rowClass = isTotal ? 'total-row' : (isSection ? 'section-row' : 'child-row');
  return `
    <tr class="${rowClass}">
      <td>${label}${sub ? `<span class="${isSection?'sec-sub':'child-sub'}">${sub}</span>` : ''}</td>
      <td class="num">${fmt(vA.previsto)}</td>
      <td class="num">${fmt(vP.executado)}</td>
      <td class="num">${fmt(vA.executado)}</td>
      <td class="num">${arrowFor(avanco)} ${fmt(Math.abs(avanco))}</td>
      <td class="num">${fmt(vA.saldo)}</td>
      <td class="num">${fmt(vA.saldo*2)}</td>
    </tr>`;
}

// ---------- exportação PNG ----------
async function downloadResumoPng(){
  const statusEl = document.getElementById('status');
  const area = document.getElementById('resumoArea');
  const captureArea = document.getElementById('captureArea');
  if(!area){
    statusEl.textContent = 'Carregue os dados antes de gerar o resumo.';
    statusEl.classList.add('err');
    return;
  }
  const prevMsg = statusEl.textContent;
  statusEl.textContent = 'Gerando imagem PNG do resumo...';
  captureArea.classList.add('png-export');
  try{
    const canvas = await html2canvas(area, { backgroundColor:'#eef1f7', scale:2, useCORS:true });
    const dataUrl = canvas.toDataURL('image/png');
    const atualIdx = parseInt(document.getElementById('atualSelect').value);
    const atualWeek = loadedWeeks[atualIdx];
    const fileDate = atualWeek ? atualWeek.date : new Date().toISOString().slice(0,10);
    const link = document.createElement('a');
    link.href = dataUrl;
    link.download = `resumo-terraplanagem-${fileDate}.png`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    statusEl.textContent = prevMsg;
  }catch(e){
    console.error(e);
    statusEl.textContent = 'Erro ao gerar o PNG do resumo.';
    statusEl.classList.add('err');
  }finally{
    captureArea.classList.remove('png-export');
  }
}
async function downloadPng(){
  const statusEl = document.getElementById('status');
  const area = document.getElementById('detalhadoArea');
  const captureArea = document.getElementById('captureArea');
  if(!area){
    statusEl.textContent = 'Carregue os dados antes de gerar o comparativo detalhado.';
    statusEl.classList.add('err');
    return;
  }
  const prevMsg = statusEl.textContent;
  statusEl.textContent = 'Gerando imagem PNG do comparativo detalhado...';
  captureArea.classList.add('png-export');
  try{
    const canvas = await html2canvas(area, { backgroundColor:'#eef1f7', scale:2, useCORS:true });
    const dataUrl = canvas.toDataURL('image/png');
    const atualIdx = parseInt(document.getElementById('atualSelect').value);
    const atualWeek = loadedWeeks[atualIdx];
    const fileDate = atualWeek ? atualWeek.date : new Date().toISOString().slice(0,10);
    const link = document.createElement('a');
    link.href = dataUrl;
    link.download = `comparativo-detalhado-terraplanagem-${fileDate}.png`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    statusEl.textContent = prevMsg;
  }catch(e){
    console.error(e);
    statusEl.textContent = 'Erro ao gerar o PNG do comparativo detalhado.';
    statusEl.classList.add('err');
  }finally{
    captureArea.classList.remove('png-export');
  }
}

loadHistory();
</script>
</body>
</html>
